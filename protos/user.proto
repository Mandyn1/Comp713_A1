syntax = "proto3";
package user;

service UserService {
  rpc CheckSignIn (SignInRequest) returns (SignInResponse);
  rpc CreateAdminToken (CreateTokenRequest) returns (CreateTokenResponse);
  rpc UseAdminToken (UseTokenRequest) returns (UseTokenResponse);
}

message SignInRequest { string username = 1; string password = 2; }
message SignInResponse {}
message CreateTokenRequest { optional uint32 lifetime = 1; }
message CreateTokenResponse { string token = 1;}
message UseTokenRequest { string token = 1; optional uint32 keepFor = 2; }
message UseTokenResponse { bool valid = 1;}